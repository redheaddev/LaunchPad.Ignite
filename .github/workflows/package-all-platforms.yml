name: Package all platforms
run-name: Package all platforms.${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version to package (must match the project version)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          [xml]$project = Get-Content 'LaunchPad.Ignite.App/LaunchPad.Ignite.App.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG -replace '^v', '' } elseif ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $projectVersion }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          if ($version -ne $projectVersion) { throw "Package version $version must match project version $projectVersion. Bump the project version before packaging." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "## Packaging version`n`nResolved project version: **$version**" >> $env:GITHUB_STEP_SUMMARY

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    name: windows (${{ matrix.rid }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run test suite on Windows
        run: dotnet test LaunchPad.Ignite.Tests/LaunchPad.Ignite.Tests.csproj --configuration Release --verbosity minimal
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installers
        shell: pwsh
        run: ./Installer/build-installer.ps1 -Version '${{ needs.version.outputs.version }}' -RuntimeIdentifier '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchPad.Ignite-${{ matrix.rid }}-${{ needs.version.outputs.version }}
          path: Installer/artifacts/LaunchPad.Ignite-Setup_${{ needs.version.outputs.version }}_${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run test suite on Linux
        run: dotnet test LaunchPad.Ignite.Tests/LaunchPad.Ignite.Tests.csproj --configuration Release --verbosity minimal
      - name: Build Linux package
        run: bash ./scripts/package-linux-app.sh '${{ needs.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchPad.Ignite-Linux-${{ needs.version.outputs.version }}
          path: LaunchPad.Ignite.App/artifacts/linux/LaunchPad.Ignite-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run test suite on macOS
        run: dotnet test LaunchPad.Ignite.Tests/LaunchPad.Ignite.Tests.csproj --configuration Release --verbosity minimal
      - name: Build macOS package
        run: bash ./scripts/package-macos-app.sh '${{ needs.version.outputs.version }}' '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchPad.Ignite-${{ matrix.rid }}-${{ needs.version.outputs.version }}
          path: LaunchPad.Ignite.App/artifacts/macos/LaunchPad.Ignite-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 30
